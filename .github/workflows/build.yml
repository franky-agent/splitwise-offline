name: Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK + run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps + syntax check
        working-directory: relay
        run: |
          npm ci
          node -c server.js
      - name: Smoke test (health check)
        working-directory: relay
        run: |
          PORT=18787 node server.js &
          RELAY_PID=$!
          sleep 1
          curl -sf http://localhost:18787/health || { echo "health check failed"; kill $RELAY_PID; exit 1; }
          echo "health check passed"
          kill $RELAY_PID